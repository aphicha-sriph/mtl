<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1a7f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0004f;stop-opacity:1"/>
    </linearGradient>
    <filter id="iconShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#e0006d" flood-opacity="0.2"/>
    </filter>
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e0006d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Subtle background circle -->
  <circle cx="100" cy="100" r="90" fill="#fdf2f7" opacity="0.5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#e0006d" stroke-width="0.5" opacity="0.1"/>

  <!-- Hospital building -->
  <g transform="translate(100, 88)" filter="url(#iconShadow)">
    <!-- Main building body -->
    <rect x="-35" y="-10" width="70" height="55" rx="4" fill="white" stroke="#e0006d" stroke-width="2"/>

    <!-- Top section / entrance roof -->
    <rect x="-20" y="-30" width="40" height="24" rx="3" fill="#e0006d"/>

    <!-- Cross on top section -->
    <rect x="-4" y="-26" width="8" height="16" rx="1.5" fill="white"/>
    <rect x="-8" y="-22" width="16" height="8" rx="1.5" fill="white"/>

    <!-- Windows row 1 -->
    <rect x="-26" y="0" width="12" height="10" rx="1.5" fill="#fce4ef" stroke="#f0a0c0" stroke-width="0.5"/>
    <rect x="-6" y="0" width="12" height="10" rx="1.5" fill="#fce4ef" stroke="#f0a0c0" stroke-width="0.5"/>
    <rect x="14" y="0" width="12" height="10" rx="1.5" fill="#fce4ef" stroke="#f0a0c0" stroke-width="0.5"/>

    <!-- Windows row 2 -->
    <rect x="-26" y="16" width="12" height="10" rx="1.5" fill="#fce4ef" stroke="#f0a0c0" stroke-width="0.5"/>
    <rect x="14" y="16" width="12" height="10" rx="1.5" fill="#fce4ef" stroke="#f0a0c0" stroke-width="0.5"/>

    <!-- Door -->
    <rect x="-7" y="18" width="14" height="27" rx="2" fill="#e0006d" opacity="0.75"/>
    <circle cx="4" cy="33" r="1.2" fill="white" opacity="0.8"/>
  </g>

  <!-- Location pin (positioned at top-right of building) -->
  <g transform="translate(145, 55)" filter="url(#pinShadow)">
    <path d="M0,-22 C-12,-22 -22,-12 -22,0 C-22,15 0,32 0,32 S22,15 22,0 C22,-12 12,-22 0,-22 Z"
          fill="url(#pinGrad)"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    <circle cx="0" cy="0" r="3.5" fill="#e0006d"/>
  </g>

  <!-- Small decorative network dots -->
  <circle cx="38" cy="65" r="4" fill="#e0006d" opacity="0.15"/>
  <circle cx="25" cy="100" r="3" fill="#e0006d" opacity="0.12"/>
  <circle cx="50" cy="140" r="3.5" fill="#e0006d" opacity="0.13"/>
  <circle cx="160" cy="130" r="3" fill="#e0006d" opacity="0.12"/>
  <circle cx="170" cy="95" r="4" fill="#e0006d" opacity="0.15"/>

  <!-- Thin connecting lines from dots to building -->
  <line x1="38" y1="65" x2="70" y2="80" stroke="#e0006d" stroke-width="0.5" opacity="0.1"/>
  <line x1="25" y1="100" x2="65" y2="95" stroke="#e0006d" stroke-width="0.5" opacity="0.1"/>
  <line x1="160" y1="130" x2="135" y2="110" stroke="#e0006d" stroke-width="0.5" opacity="0.1"/>
  <line x1="170" y1="95" x2="140" y2="90" stroke="#e0006d" stroke-width="0.5" opacity="0.1"/>
</svg>