<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f7;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#fff5f9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0f4ff;stop-opacity:1"/>
    </linearGradient>

    <!-- Glow filter for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow for hospital icons -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e0006d" flood-opacity="0.15"/>
    </filter>

    <!-- Pulse animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 18; }
        50% { opacity: 0.6; r: 24; }
      }
      @keyframes pulse2 {
        0%, 100% { opacity: 0.2; r: 14; }
        50% { opacity: 0.5; r: 20; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      .pulse-ring { animation: pulse 3s ease-in-out infinite; }
      .pulse-ring2 { animation: pulse2 3.5s ease-in-out infinite; }
      .network-line {
        stroke-dasharray: 6 4;
        animation: dash 2s linear infinite;
      }
      .network-line-solid {
        opacity: 0.4;
      }
    </style>

    <!-- Hospital building symbol -->
    <symbol id="hospital" viewBox="0 0 40 40">
      <rect x="8" y="12" width="24" height="22" rx="2" fill="white" stroke="#e0006d" stroke-width="1.5"/>
      <rect x="14" y="6" width="12" height="8" rx="1" fill="#e0006d"/>
      <!-- Cross -->
      <rect x="18" y="8" width="4" height="4" rx="0.5" fill="white"/>
      <rect x="17" y="9" width="6" height="2" rx="0.5" fill="white"/>
      <!-- Windows -->
      <rect x="12" y="16" width="4" height="4" rx="0.5" fill="#fce4ef"/>
      <rect x="18" y="16" width="4" height="4" rx="0.5" fill="#fce4ef"/>
      <rect x="24" y="16" width="4" height="4" rx="0.5" fill="#fce4ef"/>
      <rect x="12" y="23" width="4" height="4" rx="0.5" fill="#fce4ef"/>
      <rect x="24" y="23" width="4" height="4" rx="0.5" fill="#fce4ef"/>
      <!-- Door -->
      <rect x="17" y="25" width="6" height="9" rx="1" fill="#e0006d" opacity="0.7"/>
    </symbol>

    <!-- Small clinic symbol -->
    <symbol id="clinic" viewBox="0 0 28 28">
      <rect x="4" y="8" width="20" height="16" rx="2" fill="white" stroke="#e0006d" stroke-width="1.2"/>
      <rect x="9" y="4" width="10" height="6" rx="1" fill="#e0006d"/>
      <rect x="12.5" y="5.5" width="3" height="3" rx="0.5" fill="white"/>
      <rect x="11.5" y="6.5" width="5" height="1" rx="0.5" fill="white"/>
      <rect x="8" y="12" width="3" height="3" rx="0.5" fill="#fce4ef"/>
      <rect x="17" y="12" width="3" height="3" rx="0.5" fill="#fce4ef"/>
      <rect x="11.5" y="17" width="5" height="7" rx="1" fill="#e0006d" opacity="0.6"/>
    </symbol>

    <!-- Location pin symbol -->
    <symbol id="pin" viewBox="0 0 20 28">
      <path d="M10 0C4.5 0 0 4.5 0 10c0 7.5 10 18 10 18s10-10.5 10-18C20 4.5 15.5 0 10 0z" fill="#e0006d"/>
      <circle cx="10" cy="10" r="4" fill="white"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#e0006d" stroke-width="1"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#e0006d" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="800" stroke="#e0006d" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="800" stroke="#e0006d" stroke-width="1"/>
  </g>

  <!-- Simplified Thailand map outline -->
  <g transform="translate(300, 40) scale(0.9)" opacity="0.08">
    <path d="M320,50 C310,30 280,20 260,30 C240,40 230,60 220,80
             C210,100 200,110 180,120 C160,130 150,150 160,170
             C170,190 180,200 190,220 C200,240 210,260 230,280
             C250,300 260,310 270,330 C280,350 290,370 300,390
             C310,410 320,420 330,440 C340,460 350,470 340,490
             C330,510 320,520 310,540 C300,560 290,570 280,590
             C270,610 260,620 250,640 C240,660 235,670 240,690
             C245,710 250,720 260,730 C270,740 280,735 290,720
             C300,700 310,680 320,660 C330,640 340,630 350,610
             C360,590 370,580 380,560 C390,540 395,520 390,500
             C385,480 380,470 370,450 C360,430 355,420 360,400
             C365,380 370,370 380,350 C390,330 395,310 390,290
             C385,270 380,260 370,240 C360,220 355,200 360,180
             C365,160 370,140 360,120 C350,100 340,80 330,60
             Z"
          fill="#e0006d" stroke="none"/>
  </g>

  <!-- Network connection lines (background layer) -->
  <g class="network-line-solid">
    <!-- Major connections -->
    <line x1="600" y1="200" x2="380" y2="300" stroke="#e0006d" stroke-width="1.5" opacity="0.15"/>
    <line x1="600" y1="200" x2="820" y2="280" stroke="#e0006d" stroke-width="1.5" opacity="0.15"/>
    <line x1="600" y1="200" x2="500" y2="400" stroke="#e0006d" stroke-width="1.5" opacity="0.15"/>
    <line x1="600" y1="200" x2="700" y2="420" stroke="#e0006d" stroke-width="1.5" opacity="0.15"/>
    <line x1="380" y1="300" x2="250" y2="450" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="820" y1="280" x2="950" y2="380" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="500" y1="400" x2="350" y2="550" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="700" y1="420" x2="850" y2="530" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="500" y1="400" x2="600" y2="580" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="700" y1="420" x2="600" y2="580" stroke="#e0006d" stroke-width="1" opacity="0.12"/>
    <line x1="380" y1="300" x2="500" y2="400" stroke="#e0006d" stroke-width="1" opacity="0.10"/>
    <line x1="820" y1="280" x2="700" y2="420" stroke="#e0006d" stroke-width="1" opacity="0.10"/>
    <line x1="250" y1="450" x2="350" y2="550" stroke="#e0006d" stroke-width="1" opacity="0.10"/>
    <line x1="950" y1="380" x2="850" y2="530" stroke="#e0006d" stroke-width="1" opacity="0.10"/>
  </g>

  <!-- Animated network lines -->
  <g>
    <line x1="600" y1="200" x2="380" y2="300" stroke="#e0006d" stroke-width="1.5" class="network-line" opacity="0.5"/>
    <line x1="600" y1="200" x2="820" y2="280" stroke="#e0006d" stroke-width="1.5" class="network-line" opacity="0.5"/>
    <line x1="600" y1="200" x2="500" y2="400" stroke="#e0006d" stroke-width="1.5" class="network-line" opacity="0.4"/>
    <line x1="600" y1="200" x2="700" y2="420" stroke="#e0006d" stroke-width="1.5" class="network-line" opacity="0.4"/>
    <line x1="380" y1="300" x2="250" y2="450" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.35"/>
    <line x1="820" y1="280" x2="950" y2="380" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.35"/>
    <line x1="500" y1="400" x2="350" y2="550" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.3"/>
    <line x1="700" y1="420" x2="850" y2="530" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.3"/>
    <line x1="500" y1="400" x2="600" y2="580" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.3"/>
    <line x1="700" y1="420" x2="600" y2="580" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.3"/>
    <line x1="380" y1="300" x2="500" y2="400" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.25"/>
    <line x1="820" y1="280" x2="700" y2="420" stroke="#e0006d" stroke-width="1" class="network-line" opacity="0.25"/>
  </g>

  <!-- Secondary network dots (smaller clinics/nodes) -->
  <g>
    <!-- Scattered small dots representing network reach -->
    <circle cx="160" cy="250" r="3" fill="#e0006d" opacity="0.2"/>
    <circle cx="200" cy="180" r="2.5" fill="#e0006d" opacity="0.15"/>
    <circle cx="300" cy="150" r="3" fill="#e0006d" opacity="0.2"/>
    <circle cx="450" cy="120" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="750" cy="140" r="2.5" fill="#e0006d" opacity="0.15"/>
    <circle cx="900" cy="200" r="3" fill="#e0006d" opacity="0.2"/>
    <circle cx="1000" cy="300" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="1050" cy="450" r="2.5" fill="#e0006d" opacity="0.15"/>
    <circle cx="150" cy="500" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="180" cy="600" r="2.5" fill="#e0006d" opacity="0.18"/>
    <circle cx="450" cy="650" r="3" fill="#e0006d" opacity="0.2"/>
    <circle cx="750" cy="620" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="900" cy="600" r="2.5" fill="#e0006d" opacity="0.18"/>
    <circle cx="1020" cy="550" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="480" cy="280" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="720" cy="310" r="2.5" fill="#e0006d" opacity="0.18"/>
    <circle cx="300" cy="400" r="2" fill="#e0006d" opacity="0.15"/>
    <circle cx="880" cy="450" r="2" fill="#e0006d" opacity="0.15"/>
  </g>

  <!-- Connecting lines from small dots to nearby nodes -->
  <g opacity="0.08" stroke="#e0006d" stroke-width="0.5">
    <line x1="160" y1="250" x2="250" y2="450"/>
    <line x1="300" y1="150" x2="380" y2="300"/>
    <line x1="900" y1="200" x2="820" y2="280"/>
    <line x1="1000" y1="300" x2="950" y2="380"/>
    <line x1="450" y1="650" x2="350" y2="550"/>
    <line x1="750" y1="620" x2="850" y2="530"/>
    <line x1="480" y1="280" x2="500" y2="400"/>
    <line x1="720" y1="310" x2="700" y2="420"/>
  </g>

  <!-- Major hospital nodes -->

  <!-- Central node: Bangkok (main hub) -->
  <g transform="translate(600, 200)" filter="url(#shadow)">
    <circle r="0" fill="#e0006d" opacity="0.08" class="pulse-ring">
      <animate attributeName="r" values="30;42;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" fill="white" stroke="#e0006d" stroke-width="2.5" opacity="0.95"/>
    <use href="#hospital" x="-20" y="-20" width="40" height="40"/>
    <text y="50" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#333">กรุงเทพฯ</text>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#888">Bangkok</text>
  </g>

  <!-- Chiang Mai -->
  <g transform="translate(380, 300)" filter="url(#shadow)">
    <circle r="0" fill="#e0006d" opacity="0.06" class="pulse-ring2">
      <animate attributeName="r" values="22;32;22" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="white" stroke="#e0006d" stroke-width="2" opacity="0.95"/>
    <use href="#clinic" x="-14" y="-14" width="28" height="28"/>
    <text y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#555">เชียงใหม่</text>
    <text y="54" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">Chiang Mai</text>
  </g>

  <!-- Khon Kaen (Northeast) -->
  <g transform="translate(820, 280)" filter="url(#shadow)">
    <circle r="0" fill="#e0006d" opacity="0.06" class="pulse-ring2">
      <animate attributeName="r" values="22;32;22" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="white" stroke="#e0006d" stroke-width="2" opacity="0.95"/>
    <use href="#clinic" x="-14" y="-14" width="28" height="28"/>
    <text y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#555">ขอนแก่น</text>
    <text y="54" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">Khon Kaen</text>
  </g>

  <!-- Phuket (South) -->
  <g transform="translate(350, 550)" filter="url(#shadow)">
    <circle r="0" fill="#e0006d" opacity="0.06" class="pulse-ring2">
      <animate attributeName="r" values="20;28;20" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.03;0.10" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="24" fill="white" stroke="#e0006d" stroke-width="1.8" opacity="0.95"/>
    <use href="#clinic" x="-12" y="-12" width="24" height="24"/>
    <text y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#555">ภูเก็ต</text>
    <text y="50" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">Phuket</text>
  </g>

  <!-- Nakhon Ratchasima -->
  <g transform="translate(700, 420)" filter="url(#shadow)">
    <circle r="0" fill="#e0006d" opacity="0.06" class="pulse-ring2">
      <animate attributeName="r" values="20;28;20" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.03;0.10" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="24" fill="white" stroke="#e0006d" stroke-width="1.8" opacity="0.95"/>
    <use href="#clinic" x="-12" y="-12" width="24" height="24"/>
    <text y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#555">โคราช</text>
    <text y="50" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">Korat</text>
  </g>

  <!-- Chiang Rai -->
  <g transform="translate(250, 450)" filter="url(#shadow)">
    <circle r="22" fill="white" stroke="#e0006d" stroke-width="1.5" opacity="0.9"/>
    <use href="#clinic" x="-11" y="-11" width="22" height="22"/>
    <text y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#666">เชียงราย</text>
  </g>

  <!-- Udon Thani -->
  <g transform="translate(950, 380)" filter="url(#shadow)">
    <circle r="22" fill="white" stroke="#e0006d" stroke-width="1.5" opacity="0.9"/>
    <use href="#clinic" x="-11" y="-11" width="22" height="22"/>
    <text y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#666">อุดรธานี</text>
  </g>

  <!-- Surat Thani -->
  <g transform="translate(500, 400)" filter="url(#shadow)">
    <circle r="22" fill="white" stroke="#e0006d" stroke-width="1.5" opacity="0.9"/>
    <use href="#clinic" x="-11" y="-11" width="22" height="22"/>
    <text y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#666">สุราษฎร์ฯ</text>
  </g>

  <!-- Songkhla -->
  <g transform="translate(600, 580)" filter="url(#shadow)">
    <circle r="22" fill="white" stroke="#e0006d" stroke-width="1.5" opacity="0.9"/>
    <use href="#clinic" x="-11" y="-11" width="22" height="22"/>
    <text y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#666">สงขลา</text>
  </g>

  <!-- Rayong -->
  <g transform="translate(850, 530)" filter="url(#shadow)">
    <circle r="22" fill="white" stroke="#e0006d" stroke-width="1.5" opacity="0.9"/>
    <use href="#clinic" x="-11" y="-11" width="22" height="22"/>
    <text y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#666">ระยอง</text>
  </g>

  <!-- Decorative elements: abstract circles -->
  <circle cx="100" cy="120" r="60" fill="none" stroke="#e0006d" stroke-width="0.5" opacity="0.06"/>
  <circle cx="100" cy="120" r="90" fill="none" stroke="#e0006d" stroke-width="0.3" opacity="0.04"/>
  <circle cx="1100" cy="680" r="70" fill="none" stroke="#e0006d" stroke-width="0.5" opacity="0.06"/>
  <circle cx="1100" cy="680" r="100" fill="none" stroke="#e0006d" stroke-width="0.3" opacity="0.04"/>

  <!-- Info badge -->
  <g transform="translate(80, 680)">
    <rect x="0" y="0" width="220" height="70" rx="12" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="220" height="70" rx="12" fill="none" stroke="#e0006d" stroke-width="1" opacity="0.2"/>
    <text x="16" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#e0006d">500+</text>
    <text x="16" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#666">โรงพยาบาลในเครือข่าย</text>
    <text x="16" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">Partner Hospitals Nationwide</text>
  </g>

  <!-- Coverage badge -->
  <g transform="translate(920, 680)">
    <rect x="0" y="0" width="200" height="70" rx="12" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="200" height="70" rx="12" fill="none" stroke="#e0006d" stroke-width="1" opacity="0.2"/>
    <text x="16" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#e0006d">77</text>
    <text x="60" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#333"> จังหวัด</text>
    <text x="16" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#666">ครอบคลุมทุกจังหวัด</text>
    <text x="16" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#999">All Provinces Covered</text>
  </g>

  <!-- Wifi/signal icon near Bangkok to indicate connectivity -->
  <g transform="translate(640, 155)" opacity="0.3">
    <path d="M0,0 A8,8 0 0,1 16,0" fill="none" stroke="#e0006d" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,4 A5,5 0 0,1 13,4" fill="none" stroke="#e0006d" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="2" fill="#e0006d"/>
  </g>
</svg>